<style>
:root{

}
@media (prefers-color-scheme: dark){

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink-1);font-size:14px;line-height:1.45}
.top{padding:20px 24px 0;max-width:1240px;margin:0 auto}

.sect{margin-top:18px}

svg text{font-family:inherit}
.tt{position:fixed;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.13);border-radius:8px;padding:8px 10px;font-size:12px;z-index:50;display:none;max-width:280px}
.tt b{font-weight:600}
.tt .r{display:flex;justify-content:space-between;gap:14px}

td{padding:6px 8px;border-bottom:1px solid var(--grid)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--wash)}
.tbl-btn{float:right;font-size:11.5px;border:1px solid var(--grid);background:none;color:var(--ink-2);border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit}
.tbl-btn:hover{background:var(--wash)}
.tblview{display:none;max-height:280px;overflow:auto;margin-top:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--grid);font-size:13px}
.alert:last-child{border-bottom:none}
.badge{flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-top:1px}
.b-crit{background:var(--crit);color:#fff}
.b-ser{background:var(--serious);color:#fff}
.b-warn{background:var(--warn);color:#3a2c00}
.b-info{background:var(--s1);color:#fff}
.muted{color:var(--ink-3)}
.pill{display:inline-block;font-size:11px;border:1px solid var(--grid);border-radius:99px;padding:1px 8px;color:var(--ink-2)}
.trend-up{color:var(--crit)} .trend-down{color:var(--good-text)}
.note{font-size:11.5px;color:var(--ink-3);margin-top:8px}
.view{display:none}.view.on{display:block}
.bench{font-size:11.5px;color:var(--ink-3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px}

.mx{border:none;background:none;font-size:22px;color:var(--ink-3);cursor:pointer;line-height:1;font-family:inherit}
.dl{font-size:12px;border:1px solid var(--grid);border-radius:7px;background:none;color:var(--ink-1);padding:4px 10px;cursor:pointer;font-family:inherit}
.dl:hover{background:var(--wash)}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('data-json').textContent);
const NOW = Math.floor(new Date('2026-08-13T00:00:00Z').getTime()/1000);
const CCS = DATA.ccs;
const DAY=86400;
const fmt$ = v => '$'+Math.round(v).toLocaleString('es-MX');
const fmtC = v => v>=1e6 ? '$'+(v/1e6).toFixed(2)+' M' : v>=1e3 ? '$'+(v/1e3).toFixed(0)+' mil' : '$'+Math.round(v);
const fmtD = v => v==null?'—':(v<1? (v*24).toFixed(1)+' h' : v.toFixed(1)+' d');
const pct = v => (v*100).toFixed(1)+'%';
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function isoWeek(ts){const d=new Date(ts*1000);const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));const w=1+Math.round(((t-f)/DAY/1000-3+((f.getUTCDay()+6)%7))/7);return t.getUTCFullYear()+'-S'+String(w).padStart(2,'0')}
function weekLabel(w){return w.slice(5)}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------- drill-down modal ----------
const STL={borrador:'Borrador',pendiente:'En aprobación',aprobado_director:'En aprobación',aprobado_ejecutivo:'En aprobación',requiere_correccion:'Requiere corrección',pendiente_revision_cxp:'En revisión CxP',pendiente_pago:'Programado/pagado',aprobado:'Aprobado',rechazado:'Rechazado'};
const fmtDate=ts=>ts?new Date(ts*1000).toISOString().slice(0,10):'—';
const csvq=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
let modalRows=[];
function showDetail(title,rs){
  modalRows=[...rs].sort((a,b)=>b.tot-a.tot);
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-sum').textContent=`${rs.length.toLocaleString('es-MX')} solicitudes · ${fmt$(rs.reduce((a,r)=>a+r.tot,0))} · ordenadas por monto`;
  const lim=modalRows.slice(0,400);
  const cols=[{h:'ID',n:1},{h:'Fecha sol.'},{h:'Solicitante'},{h:'Centro de costos'},{h:'Categoría'},{h:'Monto',n:1},{h:'Estatus'},{h:'Pagado'}];
  document.getElementById('m-body').innerHTML=tableHTML(cols,lim.map(r=>[r.id,fmtDate(r.sb||r.cr),esc(r.u),esc(CCS[r.cc]?.name||'—'),esc(cap(r.cat)),fmt$(r.tot),STL[r.st]||r.st,fmtDate(r.pd)]))+(rs.length>400?`<div class="note">Mostrando 400 de ${rs.length.toLocaleString('es-MX')} — el CSV incluye todas.</div>`:'');
  document.getElementById('mbg').classList.add('on');
}
document.getElementById('m-x').onclick=()=>document.getElementById('mbg').classList.remove('on');
document.getElementById('mbg').addEventListener('click',e=>{if(e.target.id==='mbg')e.currentTarget.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('mbg').classList.remove('on')});
document.getElementById('m-dl').onclick=()=>{
  const head=['id','fecha_solicitud','solicitante','centro_costos','empresa','categoria','tipo','monto','estatus','fecha_pago','semana_pago','emisor','rechazos','correcciones'];
  const lines=[head.join(',')].concat(modalRows.map(r=>[r.id,fmtDate(r.sb||r.cr),csvq(r.u),csvq(CCS[r.cc]?.name||''),csvq(CCS[r.cc]?.co||''),csvq(r.cat),r.ty,r.tot,r.st,fmtDate(r.pd),r.pw||'',csvq(r.em),r.rj,r.co].join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='detalle_reembolsos.csv';a.click();URL.revokeObjectURL(a.href);
};

// ---------- filters ----------
const $range=document.getElementById('f-range'), $co=document.getElementById('f-co'), $cc=document.getElementById('f-cc');
const companies=[...new Set(Object.values(CCS).map(c=>c.co))].sort();
companies.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$co.appendChild(o)});
function fillCC(){
  const co=$co.value; const cur=$cc.value;
  $cc.innerHTML='<option value="">Todos</option>';
  Object.entries(CCS).filter(([id,c])=>!co||c.co===co).sort((a,b)=>a[1].name.localeCompare(b[1].name))
   .forEach(([id,c])=>{const o=document.createElement('option');o.value=id;o.textContent=c.name;$cc.appendChild(o)});
  if([...$cc.options].some(o=>o.value===cur)) $cc.value=cur;
}
fillCC();
function filtered(){
  const days=$range.value==='all'?null:+$range.value;
  const t0=days?NOW-days*DAY:0;
  const co=$co.value, cc=$cc.value?+$cc.value:null;
  return DATA.rows.filter(r=>{
    const t=r.sb||r.cr; if(t<t0) return false;
    if(cc && r.cc!==cc) return false;
    if(co && (!r.cc || !CCS[r.cc] || CCS[r.cc].co!==co)) return false;
    return true;
  });
}
[$range,$co].forEach(el=>el.addEventListener('change',()=>{if(el===$co)fillCC();render()}));
$cc.addEventListener('change',render);

// ---------- tooltip ----------
const tt=document.getElementById('tt');
function showTT(html,ev){tt.innerHTML=html;tt.style.display='block';moveTT(ev)}
function moveTT(ev){const w=tt.offsetWidth,h=tt.offsetHeight;let x=ev.clientX+14,y=ev.clientY+12;if(x+w>innerWidth-8)x=ev.clientX-w-12;if(y+h>innerHeight-8)y=ev.clientY-h-10;tt.style.left=x+'px';tt.style.top=y+'px'}
function hideTT(){tt.style.display='none'}
document.addEventListener('scroll',hideTT,true);

// ---------- chart builders ----------
let uid=0;
function card(title,cap,body,tableHTML){
  const id='c'+(++uid);
  return `<div class="card"><h3>${esc(title)}${tableHTML?`<button class="tbl-btn" onclick="toggleTbl('${id}')">Tabla</button>`:''}</h3>
  <div class="cap">${esc(cap)}</div>${body}${tableHTML?`<div class="tblview" id="${id}">${tableHTML}</div>`:''}</div>`;
}
window.toggleTbl=id=>{const e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'};

function hbar(items,opts={}){
  // items: {label, value, sub, color, tip}
  const max=Math.max(...items.map(i=>i.value),1e-9);
  const lw=opts.labelW||160, vw=opts.valW||118, bh=18, gap=8, W=opts.w||560;
  const bw=W-lw-vw-8;
  let s=`<svg width="100%" viewBox="0 0 ${W} ${items.length*(bh+gap)}" style="display:block">`;
  items.forEach((it,i)=>{
    const y=i*(bh+gap), w=Math.max(it.value/max*bw,it.value>0?2:0);
    const col=it.color||'var(--s1)';
    s+=`<g class="hb" data-i="${i}">
      <text x="${lw-8}" y="${y+bh/2+4}" text-anchor="end" font-size="12" fill="var(--ink-2)">${esc(it.label.length>24?it.label.slice(0,23)+'…':it.label)}</text>
      <rect x="${lw}" y="${y+2}" width="${bw}" height="${bh-4}" fill="transparent"/>
      <path d="M${lw},${y+2} h${Math.max(w-4,0)} a4,4 0 0 1 4,4 v${bh-12} a4,4 0 0 1 -4,4 h-${Math.max(w-4,0)} z" fill="${col}"/>
      <text x="${lw+w+6}" y="${y+bh/2+4}" font-size="11.5" fill="var(--ink-2)" font-variant-numeric="tabular-nums">${esc(it.valLabel??Math.round(it.value).toLocaleString('es-MX'))}</text>
    </g>`;
  });
  s+='</svg>';
  return {svg:s,bind:(el)=>{el.querySelectorAll('.hb').forEach(g=>{
    const it=items[+g.dataset.i];
    g.addEventListener('mousemove',ev=>{showTT(it.tip||`<b>${esc(it.label)}</b><div>${esc(it.valLabel??it.value)}</div>`,ev)});
    g.addEventListener('mouseleave',hideTT);
    if(it.rows){g.style.cursor='pointer';g.addEventListener('click',()=>showDetail(it.dTitle||it.label,it.rows));}
  })}};
}

function lineChart(series,xs,opts={}){
  // series: [{name,color,pts:[y|null], fmt}]  xs: labels
  const W=opts.w||560,H=opts.h||200,pl=48,pr=opts.pr||10,pt=12,pb=26;
  const iw=W-pl-pr, ih=H-pt-pb;
  const all=series.flatMap(s=>s.pts.filter(v=>v!=null));
  let max=Math.max(...all,1e-9); max*=1.08;
  const nice=niceMax(max); max=nice.max;
  const X=i=>pl+(xs.length<2?iw/2:i/(xs.length-1)*iw);
  const Y=v=>pt+ih-(v/max*ih);
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">`;
  for(let g=0;g<=nice.n;g++){const v=max/nice.n*g,y=Y(v);
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${pl-6}" y="${y+3.5}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-variant-numeric="tabular-nums">${(opts.fmtY||(v=>v.toLocaleString('es-MX')))(v)}</text>`;}
  const step=Math.max(1,Math.ceil(xs.length/10));
  xs.forEach((x,i)=>{if(i%step===0||i===xs.length-1)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${esc(x)}</text>`});
  series.forEach(se=>{
    let d='',started=false;
    se.pts.forEach((v,i)=>{if(v==null){started=false;return}d+=(started?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);started=true});
    if(opts.area) s+=`<path d="${d} L${X(se.pts.length-1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="${se.color}" opacity="0.10" stroke="none"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=se.pts.map((v,i)=>v!=null?i:null).filter(v=>v!=null).pop();
    if(li!=null) s+=`<circle cx="${X(li)}" cy="${Y(se.pts[li])}" r="4" fill="${se.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
  });
  s+=`<rect class="hover" x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent"/>`;
  s+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="var(--axis)" stroke-width="1" style="display:none;pointer-events:none"/>`;
  s+='</svg>';
  return {svg:s,bind:el=>{
    const svg=el.querySelector('svg'),hover=svg.querySelector('.hover'),xh=svg.querySelector('.xh');
    hover.addEventListener('mousemove',ev=>{
      const r=svg.getBoundingClientRect(), sx=W/r.width;
      const px=(ev.clientX-r.left)*sx;
      const i=Math.round((px-pl)/(iw)*(xs.length-1));
      if(i<0||i>=xs.length)return;
      xh.style.display='block';xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));
      let html=`<b>${esc(opts.xPrefix||'Semana')} ${esc(xs[i])}</b>`;
      series.forEach(se=>{const v=se.pts[i];html+=`<div class="r"><span><span class="sw" style="background:${se.color}"></span> ${esc(se.name)}</span><span>${v==null?'—':(se.fmt||(x=>x.toLocaleString('es-MX')))(v)}</span></div>`});
      if(opts.extraTip) html+=opts.extraTip(i);
      showTT(html,ev);
    });
    if(opts.onClick){hover.style.cursor='pointer';hover.addEventListener('click',ev=>{const r=svg.getBoundingClientRect(),sx=W/r.width;const px=(ev.clientX-r.left)*sx;const i=Math.round((px-pl)/iw*(xs.length-1));if(i>=0&&i<xs.length)opts.onClick(i)});}
    hover.addEventListener('mouseleave',()=>{hideTT();xh.style.display='none'});
  }};
}
function niceMax(v){
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]){const c=m*p;if(c>=v)return {max:c,n:(m===1.5||m===2.5)?3:4}}
  return {max:v,n:4};
}
function legendHTML(items){return `<div class="legend">${items.map(i=>`<span><span class="sw" style="background:${i.color}"></span>${esc(i.name)}</span>`).join('')}</div>`}
function tableHTML(cols,rows){
  return `<table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${cols[i].n?'n':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function kpi(lbl,val,sub,hero){return `<div class="card kpi"><div class="lbl">${esc(lbl)}</div><div class="val ${hero?'hero':''}">${val}</div>${sub?`<div class="d">${sub}</div>`:''}</div>`}

// ---------- shared metric helpers ----------
const isPaid=r=>r.pd!=null;
const inProcess=r=>!['rechazado','borrador'].includes(r.st)&&!r.pd;
const submitted=r=>r.sb!=null;
function stageDurs(rows){
  const d=(a,b)=>rows.filter(r=>r[a]&&r[b]&&r[b]>=r[a]).map(r=>(r[b]-r[a])/DAY);
  return {
    resp: median(d('sb','fa')),
    chain: median(d('fa','od')),
    wait: median(d('od','cx')),
    pay: median(d('cx','pd')),
    total: median(d('sb','pd'))
  };
}
function weeksBetween(rows,field){
  const set=new Set(rows.filter(r=>r[field]).map(r=>isoWeek(r[field])));
  return [...set].sort();
}
function weeklyAgg(rows,field,valFn){
  const m={};
  rows.forEach(r=>{if(!r[field])return;const w=isoWeek(r[field]);m[w]=(m[w]||0)+valFn(r)});
  return m;
}

// ---------- VIEW: Dirección General ----------
function renderDG(rows){
  const paid=rows.filter(isPaid), proc=rows.filter(inProcess), sub=rows.filter(submitted);
  const spent=paid.reduce((a,r)=>a+r.tot,0);
  const pipeline=proc.reduce((a,r)=>a+r.tot,0);
  const st=stageDurs(rows);
  const rej=rows.filter(r=>r.st==='rechazado').length;
  const rejRate=sub.length?rej/sub.length:0;

  // weekly paid spend + count
  const wk=weeksBetween(rows.filter(isPaid),'pd');
  const wSpend=weeklyAgg(paid,'pd',r=>r.tot), wCnt=weeklyAgg(paid,'pd',()=>1);
  const wkAll=wk.length>1?wk:weeksBetween(rows,'sb');
  const lcSpend=lineChart([{name:'Gasto pagado',color:css('--s1'),pts:wkAll.map(w=>wSpend[w]??0),fmt:fmt$}],
    wkAll.map(weekLabel),{area:true,fmtY:v=>fmtC(v),extraTip:i=>`<div class="r"><span class="muted">Solicitudes pagadas</span><span>${wCnt[wkAll[i]]||0}</span></div>`,onClick:i=>showDetail('Pagadas en la semana '+wkAll[i],paid.filter(r=>isoWeek(r.pd)===wkAll[i]))});

  // cycle time trend by payment week
  const ctm={};
  paid.forEach(r=>{if(!r.sb)return;const w=isoWeek(r.pd);(ctm[w]=ctm[w]||[]).push((r.pd-r.sb)/DAY)});
  const lcCT=lineChart([{name:'Mediana días solicitud→pago',color:css('--s2'),pts:wkAll.map(w=>ctm[w]?median(ctm[w]):null),fmt:v=>v.toFixed(1)+' d'}],
    wkAll.map(weekLabel),{fmtY:v=>v.toFixed(0)+' d',onClick:i=>showDetail('Pagadas en la semana '+wkAll[i],paid.filter(r=>isoWeek(r.pd)===wkAll[i]&&r.sb))});

  // stage bars
  const sp=(a,b)=>rows.filter(r=>r[a]&&r[b]&&r[b]>=r[a]);
  const stages=[
    {label:'Solicitud → 1a aprobación',value:st.resp||0,valLabel:fmtD(st.resp),rows:sp('sb','fa')},
    {label:'Cadena de aprobaciones',value:st.chain||0,valLabel:fmtD(st.chain),rows:sp('fa','od')},
    {label:'Espera revisión CxP',value:st.wait||0,valLabel:fmtD(st.wait),color:css('--s2'),rows:sp('od','cx')},
    {label:'Revisión CxP → pago',value:st.pay||0,valLabel:fmtD(st.pay),rows:sp('cx','pd')}
  ].map(s=>({...s,dTitle:'Etapa: '+s.label,tip:`<b>${esc(s.label)}</b><div>Mediana: ${s.valLabel}</div><div class="muted">Clic para ver solicitudes</div>`}));
  const hbStages=hbar(stages,{labelW:190});

  // top cost centers
  const ccSpend={};
  rows.filter(r=>!['rechazado','borrador'].includes(r.st)).forEach(r=>{if(!r.cc)return;(ccSpend[r.cc]=ccSpend[r.cc]||{v:0,n:0}).v+=r.tot;ccSpend[r.cc].n++});
  const topCC=Object.entries(ccSpend).sort((a,b)=>b[1].v-a[1].v).slice(0,12)
    .map(([id,d])=>({label:CCS[id]?.name||('#'+id),value:d.v,valLabel:fmtC(d.v),rows:rows.filter(r=>r.cc===+id&&!['rechazado','borrador'].includes(r.st)),dTitle:CCS[id]?.name,
      tip:`<b>${esc(CCS[id]?.name)}</b><div class="r"><span class="muted">Monto</span><span>${fmt$(d.v)}</span></div><div class="r"><span class="muted">Solicitudes</span><span>${d.n}</span></div><div class="r"><span class="muted">Empresa</span><span>${esc(CCS[id]?.co)}</span></div>`}));
  const hbCC=hbar(topCC,{labelW:200});
  const tblCC=tableHTML([{h:'Centro de costos'},{h:'Monto',n:1},{h:'Solicitudes',n:1}],
    Object.entries(ccSpend).sort((a,b)=>b[1].v-a[1].v).map(([id,d])=>[esc(CCS[id]?.name||id),fmt$(d.v),d.n]));

  // categories
  const cats={};
  rows.filter(r=>!['rechazado','borrador'].includes(r.st)).forEach(r=>{cats[r.cat]=(cats[r.cat]||0)+r.tot});
  const catSort=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const okRows=rows.filter(r=>!['rechazado','borrador'].includes(r.st));
  const topCat=catSort.slice(0,8).map(([c,v],i)=>({label:cap(c),value:v,valLabel:fmtC(v),rows:okRows.filter(r=>r.cat===c),dTitle:'Categoría: '+cap(c)}));
  const rest=catSort.slice(8).reduce((a,[,v])=>a+v,0);
  const top8=new Set(catSort.slice(0,8).map(([c])=>c));
  if(rest>0)topCat.push({label:'Otras',value:rest,valLabel:fmtC(rest),color:'var(--other)',rows:okRows.filter(r=>!top8.has(r.cat)),dTitle:'Otras categorías'});
  const hbCat=hbar(topCat,{labelW:200});
  const tblCat=tableHTML([{h:'Categoría'},{h:'Monto',n:1}],catSort.map(([c,v])=>[esc(cap(c)),fmt$(v)]));

  // status funnel
  const stOrder=[['borrador','Borrador'],['pendiente','En aprobación (centro de costos)'],['requiere_correccion','Requiere corrección'],['pendiente_revision_cxp','En revisión CxP'],['pendiente_pago','Programado / pagado'],['aprobado','Aprobado (histórico)'],['rechazado','Rechazado']];
  const stCnt={};rows.forEach(r=>stCnt[r.st]=(stCnt[r.st]||0)+1);
  stCnt['pendiente']=(stCnt['pendiente']||0)+(stCnt['aprobado_director']||0)+(stCnt['aprobado_ejecutivo']||0);
  const stRows=k=>k==='pendiente'?rows.filter(r=>['pendiente','aprobado_director','aprobado_ejecutivo'].includes(r.st)):rows.filter(r=>r.st===k);
  const funnel=stOrder.filter(([k])=>stCnt[k]).map(([k,l])=>({label:l,value:stCnt[k],valLabel:stCnt[k].toLocaleString('es-MX'),color:k==='rechazado'?'var(--other)':undefined,rows:stRows(k),dTitle:'Estatus: '+l}));
  const hbFun=hbar(funnel,{labelW:230});

  // alerts
  const alerts=buildAlerts(rows);
  const alertsHTML=alerts.map(a=>`<div class="alert"><span class="badge b-${a.sev}">${a.tag}</span><div>${a.html}</div></div>`).join('')||'<div class="muted">Sin señales relevantes en el filtro actual.</div>';

  document.getElementById('v-dg').innerHTML=`
    <div class="grid g4 sect">
      ${kpi('Gasto pagado (periodo)',fmtC(spent),`${paid.length.toLocaleString('es-MX')} solicitudes pagadas`,true)}
      ${kpi('Monto en proceso',fmtC(pipeline),`${proc.length.toLocaleString('es-MX')} solicitudes en flujo`)}
      ${kpi('Mediana solicitud → pago',st.total!=null?st.total.toFixed(1)+' d':'—','ciclo completo')}
      ${kpi('Tasa de rechazo',pct(rejRate),`${rej} rechazadas de ${sub.length.toLocaleString('es-MX')} enviadas`)}
    </div>
    <div class="sect grid g2">
      ${card('Gasto pagado por semana','Monto pagado según la semana en que Pagadores ejecutó el pago','<div id="ch-spend"></div>')}
      ${card('Velocidad del proceso','Mediana de días de solicitud a pago, por semana de pago — ¿mejora el proceso?','<div id="ch-ct"></div>')}
    </div>
    <div class="sect grid g2">
      ${card('¿Dónde se va el tiempo?','Mediana de días por etapa del flujo (solicitudes pagadas del periodo)','<div id="ch-stages"></div><div class="note">La espera para revisión de CxP y la cadena de aprobaciones concentran la mayor parte del ciclo.</div>')}
      ${card('Estado actual de la cartera','Solicitudes por etapa del flujo','<div id="ch-funnel"></div>')}
    </div>
    <div class="sect grid g2">
      ${card('Top 12 centros de costos por gasto','Monto solicitado no rechazado en el periodo','<div id="ch-topcc"></div>',tblCC)}
      ${card('Gasto por categoría','Top 8 + otras','<div id="ch-cat"></div>',tblCat)}
    </div>
    <div class="sect">
      ${card('Señales para Dirección','Comportamientos que ameritan revisión — se recalculan con los filtros',`<div>${alertsHTML}</div>`)}
    </div>`;
  mount('ch-spend',lcSpend);mount('ch-ct',lcCT);mount('ch-stages',hbStages);
  mount('ch-funnel',hbFun);mount('ch-topcc',hbCC);mount('ch-cat',hbCat);
}

function buildAlerts(rows){
  const alerts=[];
  // over budget (fixed fund + renewals) — all-time comparison, only when no date filter distortion
  const ccSpend={};
  DATA.rows.filter(r=>r.ty==='fondo_fijo'&&!['rechazado','borrador'].includes(r.st)).forEach(r=>{if(r.cc)ccSpend[r.cc]=(ccSpend[r.cc]||0)+r.tot});
  const over=Object.entries(ccSpend).filter(([id,v])=>{const c=CCS[id];return c&&c.ff>1000&&v>(c.ff+c.ren)*1.15}).sort((a,b)=>(b[1])-(a[1])).slice(0,6);
  if(over.length)alerts.push({sev:'ser',tag:'Presupuesto',html:`<b>${over.length} fondos fijos con gasto acumulado &gt;115% de su fondo + renovaciones:</b> ${over.map(([id,v])=>`${esc(CCS[id].name)} (${fmtC(v)} vs ${fmtC(CCS[id].ff+CCS[id].ren)})`).join(' · ')}. Revisar tamaño del fondo o disciplina de renovación.`});
  // express approval chains
  const exp=[];
  Object.keys(CCS).forEach(id=>{
    const rs=rows.filter(r=>r.cc===+id&&r.sb&&r.od&&r.od>r.sb);
    if(rs.length<20)return;
    const m=median(rs.map(r=>(r.od-r.sb)/DAY));
    if(m!=null&&m<2/24)exp.push({id,m,n:rs.length});
  });
  if(exp.length)alerts.push({sev:'warn',tag:'Aprobación exprés',html:`<b>${exp.length} centros aprueban toda su cadena en menos de 2 horas (mediana):</b> ${exp.map(e=>`${esc(CCS[e.id].name)} (${fmtD(e.m)}, n=${e.n})`).join(' · ')}. Cadenas que aprueban en cascada casi instantánea sugieren revisión superficial.`});
  // duplicates
  if(DATA.dups.length)alerts.push({sev:'crit',tag:'Duplicados',html:`<b>${DATA.ndups} grupos de comprobantes con mismo RFC emisor, monto y fecha</b> presentados en solicitudes distintas (${DATA.dups.reduce((a,d)=>a+d.ids.length,0)} solicitudes). Detalle en la pestaña de Cuentas por Pagar.`});
  // approved unpaid aging
  const unpaid=rows.filter(r=>r.st==='pendiente_pago'&&!r.pd&&r.od);
  const old=unpaid.filter(r=>(NOW-r.od)/DAY>30);
  if(old.length)alerts.push({sev:'ser',tag:'Pago pendiente',html:`<b>${old.length} solicitudes aprobadas llevan más de 30 días sin pago</b> (${fmtC(old.reduce((a,r)=>a+r.tot,0))}). Impacta directamente el bolsillo del colaborador y la confianza en el sistema.`});
  // old invoices
  const oldInv=rows.filter(r=>r.sb&&r.fe&&(r.sb-r.fe)/DAY>60);
  if(oldInv.length>20)alerts.push({sev:'warn',tag:'Facturas viejas',html:`<b>${oldInv.length} solicitudes se presentaron con comprobantes de más de 60 días de antigüedad.</b> Considerar una política de plazo máximo de presentación.`});
  // backlog
  const bk=rows.filter(r=>r.st==='pendiente_revision_cxp');
  if(bk.length>300)alerts.push({sev:'info',tag:'Backlog CxP',html:`<b>${bk.length} solicitudes esperan revisión de Cuentas por Pagar</b> (${fmtC(bk.reduce((a,r)=>a+r.tot,0))}). La espera previa a CxP es hoy la etapa más larga del proceso.`});
  return alerts;
}

// ---------- VIEW: Centros de Costos ----------
function renderCC(rows){
  const selId=$cc.value?+$cc.value:null;
  const global=stageDurs(DATA.rows);
  // ranking table (respects filters incl. date/company)
  const per={};
  rows.forEach(r=>{
    if(!r.cc)return;
    const p=per[r.cc]=per[r.cc]||{n:0,v:0,rej:0,sub:0,chain:[],tot:[],rework:0};
    if(!['rechazado','borrador'].includes(r.st)){p.n++;p.v+=r.tot;p.tot.push(r.tot)}
    if(r.sb){p.sub++;if(r.st==='rechazado')p.rej++;if(r.rj+r.co>0)p.rework++}
    if(r.sb&&r.od&&r.od>r.sb)p.chain.push((r.od-r.sb)/DAY);
  });
  const rank=Object.entries(per).filter(([,p])=>p.sub>0).map(([id,p])=>({
    id:+id,cc:CCS[id],n:p.n,v:p.v,avg:p.n?p.v/p.n:0,
    rej:p.sub?p.rej/p.sub:0,rework:p.sub?p.rework/p.sub:0,
    chain:median(p.chain), express:p.chain.length?p.chain.filter(d=>d<2/24).length/p.chain.length:0
  })).sort((a,b)=>b.v-a.v);
  const rowsHTML=rank.map(r=>{
    const chainCls=r.chain==null?'':(r.chain>(global.chain+global.resp)*1.5?' style="color:var(--crit)"':'');
    const expFlag=r.express>0.5&&r.n>=15?' <span class="pill" title="Más de la mitad de las solicitudes se aprueban en toda la cadena en <2 h">exprés</span>':'';
    const rejFlag=r.rej>0.15?' style="color:var(--crit)"':'';
    return `<tr data-cc="${r.id}" style="cursor:pointer">
      <td>${esc(r.cc?.name||r.id)}${expFlag}</td><td class="muted">${esc(r.cc?.co||'')}</td>
      <td class="n">${r.n.toLocaleString('es-MX')}</td><td class="n">${fmt$(r.v)}</td>
      <td class="n">${fmt$(r.avg)}</td><td class="n"${chainCls}>${fmtD(r.chain)}</td>
      <td class="n"${rejFlag}>${pct(r.rej)}</td><td class="n">${pct(r.rework)}</td></tr>`;
  }).join('');
  const rankTable=`<div style="max-height:420px;overflow:auto"><table><thead><tr>
    <th>Centro de costos</th><th>Empresa</th><th class="n">Solic.</th><th class="n">Monto</th>
    <th class="n">Ticket prom.</th><th class="n">Días aprobación</th><th class="n">% rechazo</th><th class="n">% con retrabajo</th>
    </tr></thead><tbody>${rowsHTML}</tbody></table></div>
    <div class="note">Clic en un renglón para ver el detalle del centro. "Días aprobación" = mediana de solicitud a última aprobación interna. Benchmark global: ${fmtD((global.resp||0)+(global.chain||0))} · rechazo ${pct(DATA.rows.filter(r=>r.st==='rechazado').length/DATA.rows.filter(submitted).length)}.</div>`;

  // approver behavior table (ops stages)
  const ap=DATA.approvers.filter(a=>a.stage==='ops'&&a.n>=20).sort((a,b)=>(b.med??0)-(a.med??0)).slice(0,15);
  const apFast=DATA.approvers.filter(a=>a.stage==='ops'&&a.n>=30).sort((a,b)=>(b.fast/b.n)-(a.fast/a.n)).slice(0,10);
  const apTable=tableHTML([{h:'Aprobador'},{h:'Aprob.',n:1},{h:'Mediana resp.',n:1},{h:'P90',n:1},{h:'% <5 min',n:1},{h:'Rechazos',n:1}],
    ap.map(a=>[esc(a.u),a.n.toLocaleString('es-MX'),fmtD(a.med/24),fmtD(a.p90/24),pct(a.fast/a.n),a.rej]));
  const apFastTable=tableHTML([{h:'Aprobador'},{h:'Aprob.',n:1},{h:'% <5 min',n:1},{h:'Rechazos',n:1}],
    apFast.map(a=>[esc(a.u),a.n.toLocaleString('es-MX'),pct(a.fast/a.n),a.rej]));

  let detail='';
  if(selId){
    detail=ccDetail(selId,rows,global);
  }
  document.getElementById('v-cc').innerHTML=`
    ${selId?detail:''}
    <div class="sect">
      ${card('Ranking de centros de costos','Ordenado por monto en el periodo filtrado — señales en rojo: fuera de tendencia',rankTable)}
    </div>
    <div class="sect grid g2">
      ${card('Aprobadores más lentos','Cadena interna — mediana de tiempo de respuesta desde que la solicitud llega a su turno (mín. 20 aprobaciones)',apTable)}
      ${card('Aprobadores "exprés"','Mayor proporción de aprobaciones en menos de 5 minutos (mín. 30). Alta velocidad + cero rechazos sugiere aprobación sin revisión',apFastTable)}
    </div>`;
  document.querySelectorAll('#v-cc tr[data-cc]').forEach(tr=>tr.addEventListener('click',()=>{$cc.value=tr.dataset.cc;render();window.scrollTo({top:0,behavior:'smooth'})}));
  if(selId){
    const wkS=document.getElementById('cc-spark');if(wkS&&window.__ccLine){mount('cc-spark',window.__ccLine)}
    if(window.__ccStages)mount('cc-stages',window.__ccStages);
    if(window.__ccCat)mount('cc-cat',window.__ccCat);
  }
}
function ccDetail(id,rows,global){
  const c=CCS[id];
  const rs=rows.filter(r=>r.cc===id);
  const ok=rs.filter(r=>!['rechazado','borrador'].includes(r.st));
  const spent=ok.reduce((a,r)=>a+r.tot,0);
  const st=stageDurs(rs);
  const wk=weeksBetween(ok,'sb');
  const wS=weeklyAgg(ok.filter(r=>r.sb),'sb',r=>r.tot);
  window.__ccLine=wk.length>1?lineChart([{name:'Monto solicitado',color:css('--s1'),pts:wk.map(w=>wS[w]??0),fmt:fmt$}],wk.map(weekLabel),{area:true,h:170,fmtY:fmtC,onClick:i=>showDetail(c.name+' — semana '+wk[i],ok.filter(r=>r.sb&&isoWeek(r.sb)===wk[i]))}):null;
  const ccsp=(a,b)=>rs.filter(r=>r[a]&&r[b]&&r[b]>=r[a]);
  const stages=[
    {label:'Solicitud → 1a aprobación',value:st.resp||0,valLabel:fmtD(st.resp),bench:global.resp,rows:ccsp('sb','fa')},
    {label:'Cadena de aprobaciones',value:st.chain||0,valLabel:fmtD(st.chain),bench:global.chain,rows:ccsp('fa','od')},
    {label:'Espera revisión CxP',value:st.wait||0,valLabel:fmtD(st.wait),bench:global.wait,color:css('--s2'),rows:ccsp('od','cx')},
    {label:'Revisión → pago',value:st.pay||0,valLabel:fmtD(st.pay),bench:global.pay,rows:ccsp('cx','pd')}
  ].map(s=>({...s,dTitle:c.name+' — '+s.label,tip:`<b>${esc(s.label)}</b><div class="r"><span class="muted">Este centro</span><span>${s.valLabel}</span></div><div class="r"><span class="muted">Global</span><span>${fmtD(s.bench)}</span></div>`}));
  window.__ccStages=hbar(stages,{labelW:190});
  const cats={};ok.forEach(r=>{cats[r.cat]=(cats[r.cat]||0)+r.tot});
  const catS=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([k,v])=>({label:cap(k),value:v,valLabel:fmtC(v),rows:ok.filter(r=>r.cat===k),dTitle:c.name+' — '+cap(k)}));
  window.__ccCat=hbar(catS,{labelW:190});
  const users={};ok.forEach(r=>{const u=users[r.u]=users[r.u]||{n:0,v:0};u.n++;u.v+=r.tot});
  const topU=Object.entries(users).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  const uTable=tableHTML([{h:'Solicitante'},{h:'Solic.',n:1},{h:'Monto',n:1}],topU.map(([u,d])=>[esc(u),d.n,fmt$(d.v)]));
  // signals for this CC
  const sig=[];
  const oldInv=rs.filter(r=>r.sb&&r.fe&&(r.sb-r.fe)/DAY>60).length;
  if(oldInv)sig.push(`${oldInv} comprobantes con &gt;60 días de antigüedad al solicitarse`);
  const wkd=ok.filter(r=>r.fe&&[0,6].includes(new Date(r.fe*1000).getUTCDay())).length;
  if(ok.length&&wkd/ok.length>0.25)sig.push(`${pct(wkd/ok.length)} del gasto se genera en fin de semana`);
  const round=ok.filter(r=>r.tot>=100&&r.tot%100===0).length;
  if(ok.length&&round/ok.length>0.3)sig.push(`${pct(round/ok.length)} de comprobantes con montos redondos (múltiplos de $100)`);
  const rej=rs.filter(r=>r.st==='rechazado').length, subN=rs.filter(submitted).length;
  const budget=c.ff>1000?`Fondo fijo ${fmt$(c.ff)} · renovaciones acumuladas ${fmt$(c.ren)}`:'Sin fondo fijo configurado';
  return `<div class="sect">
    <div class="card">
      <h3>${esc(c.name)} <span class="pill">${esc(c.co)}</span> <span class="pill">Director: ${esc(c.dir)}</span> <span class="pill">${c.steps||'—'} pasos de aprobación</span></h3>
      <div class="cap">${budget}</div>
      <div class="grid g4">
        ${kpi('Monto en el periodo',fmtC(spent),`${ok.length} solicitudes`)}
        ${kpi('Ticket promedio',ok.length?fmt$(spent/ok.length):'—','')}
        ${kpi('Ciclo solicitud → pago',st.total!=null?st.total.toFixed(1)+' d':'—',`global: ${global.total?.toFixed(1)} d`)}
        ${kpi('Rechazos',subN?pct(rej/subN):'—',`${rej} de ${subN} enviadas`)}
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div><h3>Tendencia semanal de gasto</h3><div class="cap">Por semana de solicitud</div><div id="cc-spark">${window.__ccLine?'':'<div class="muted">Sin datos suficientes.</div>'}</div></div>
        <div><h3>Tiempos por etapa vs global</h3><div class="cap">Mediana de días — pasa el cursor para comparar</div><div id="cc-stages"></div></div>
        <div><h3>Categorías de gasto</h3><div class="cap">Top 7 por monto</div><div id="cc-cat"></div></div>
        <div><h3>Principales solicitantes</h3><div class="cap">Por monto en el periodo</div>${uTable}</div>
      </div>
      ${sig.length?`<div class="note"><b>Señales:</b> ${sig.join(' · ')}</div>`:''}
    </div></div>`;
}

// ---------- VIEW: CxP ----------
function renderCXP(rows){
  const bk=rows.filter(r=>r.st==='pendiente_revision_cxp');
  const bkAmt=bk.reduce((a,r)=>a+r.tot,0);
  const unpaid=rows.filter(r=>r.st==='pendiente_pago'&&!r.pd);
  const paid=rows.filter(isPaid);
  const st=stageDurs(rows);
  // aging buckets for backlog (since last ops approval, fallback submit)
  const buckets=[['0–7 días',0,7],['8–14 días',7,14],['15–30 días',14,30],['31–60 días',30,60],['> 60 días',60,1e9]];
  const ageOf=r=>{const t=r.od||r.sb||r.cr;return (NOW-t)/DAY};
  const bAgg=buckets.map(([l,a,b])=>{const items=bk.filter(r=>{const d=ageOf(r);return d>a&&d<=b});return {label:l,value:items.length,valLabel:`${items.length} · ${fmtC(items.reduce((x,r)=>x+r.tot,0))}`,color:a>=30?'var(--crit)':a>=14?'var(--serious)':css('--s1'),rows:items,dTitle:'Backlog en espera '+l,
    tip:`<b>${l}</b><div class="r"><span class="muted">Solicitudes</span><span>${items.length}</span></div><div class="r"><span class="muted">Monto</span><span>${fmt$(items.reduce((x,r)=>x+r.tot,0))}</span></div>`}});
  const hbAging=hbar(bAgg,{labelW:110});
  // weekly throughput: reviewed vs paid
  const wkR=weeklyAgg(rows.filter(r=>r.cx),'cx',()=>1), wkP=weeklyAgg(paid,'pd',()=>1);
  const wks=[...new Set([...Object.keys(wkR),...Object.keys(wkP)])].sort();
  const lcTh=lineChart([
    {name:'Revisadas',color:css('--s1'),pts:wks.map(w=>wkR[w]??0)},
    {name:'Pagadas',color:css('--s2'),pts:wks.map(w=>wkP[w]??0)}
  ],wks.map(weekLabel),{onClick:i=>showDetail('Actividad CxP — semana '+wks[i],rows.filter(r=>(r.cx&&isoWeek(r.cx)===wks[i])||(r.pd&&isoWeek(r.pd)===wks[i])))});
  // workload per person
  const load={};
  rows.forEach(r=>{
    if(r.rev&&r.cx){const p=load[r.rev]=load[r.rev]||{rev:0,pay:0};p.rev++}
    if(r.pay&&r.pd){const p=load[r.pay]=load[r.pay]||{rev:0,pay:0};p.pay++}
  });
  const loadItems=Object.entries(load).map(([u,d])=>({u,t:d.rev+d.pay,...d})).sort((a,b)=>b.t-a.t).slice(0,10);
  const hbLoad=hbar(loadItems.map(l=>({label:l.u,value:l.t,valLabel:`${l.t}`,rows:rows.filter(r=>(r.rev===l.u&&r.cx)||(r.pay===l.u&&r.pd)),dTitle:'Procesadas por '+l.u,
    tip:`<b>${esc(l.u)}</b><div class="r"><span class="muted">Revisiones</span><span>${l.rev}</span></div><div class="r"><span class="muted">Pagos</span><span>${l.pay}</span></div>`})),{labelW:200});
  const bulkPct=paid.length?paid.filter(r=>r.blk).length/paid.length:0;
  // oldest unpaid table
  const oldUnpaid=[...unpaid].sort((a,b)=>ageOf(b)-ageOf(a)).slice(0,15);
  const oldTable=tableHTML([{h:'ID',n:1},{h:'Centro de costos'},{h:'Solicitante'},{h:'Monto',n:1},{h:'Días desde aprobación',n:1}],
    oldUnpaid.map(r=>[r.id,esc(CCS[r.cc]?.name||'—'),esc(r.u),fmt$(r.tot),Math.round(ageOf(r))]));
  // oldest backlog table
  const oldBk=[...bk].sort((a,b)=>ageOf(b)-ageOf(a)).slice(0,15);
  const bkTable=tableHTML([{h:'ID',n:1},{h:'Centro de costos'},{h:'Solicitante'},{h:'Monto',n:1},{h:'Días en espera',n:1}],
    oldBk.map(r=>[r.id,esc(CCS[r.cc]?.name||'—'),esc(r.u),fmt$(r.tot),Math.round(ageOf(r))]));
  // duplicates
  const idMap={};DATA.rows.forEach(r=>idMap[r.id]=r);
  const dupBody=DATA.dups.map((d,ix)=>{
    const rs=d.ids.map(i=>idMap[+i]).filter(Boolean);
    const ccn=[...new Set(rs.map(r=>CCS[r.cc]?.name||'—'))].join(', ');
    const us=[...new Set(rs.map(r=>r.u))].join(', ');
    return `<tr data-dup="${ix}" style="cursor:pointer"><td>${esc(d.key)}</td><td class="n">${d.ids.length}</td><td>${esc(us)}</td><td>${esc(ccn.length>60?ccn.slice(0,59)+'…':ccn)}</td></tr>`;
  }).join('');
  const dupTable=`<div style="max-height:320px;overflow:auto"><table><thead><tr><th>RFC emisor · monto · fecha</th><th class="n">Solic.</th><th>Solicitantes</th><th>Centros de costos</th></tr></thead><tbody>${dupBody}</tbody></table></div>
  <div class="note">Mismo RFC emisor, mismo monto y misma fecha de comprobante en solicitudes distintas no rechazadas. <b>Ninguno comparte UUID fiscal</b> (0 UUIDs duplicados en toda la base): son facturas distintas, no re-presentaciones del mismo XML — el patrón a revisar es compra repetida idéntica o posible fraccionamiento. Nota: 955 solicitudes (19%) no tienen CFDI/UUID y quedan fuera de este control.</div>`;

  document.getElementById('v-cxp').innerHTML=`
    <div class="grid g4 sect">
      ${kpi('Backlog de revisión',bk.length.toLocaleString('es-MX'),fmtC(bkAmt)+' por revisar',true)}
      ${kpi('Aprobadas sin pagar',unpaid.length.toLocaleString('es-MX'),fmtC(unpaid.reduce((a,r)=>a+r.tot,0)))}
      ${kpi('Mediana espera → revisión',fmtD(st.wait),'desde última aprobación interna')}
      ${kpi('Mediana revisión → pago',fmtD(st.pay),`${paid.length.toLocaleString('es-MX')} pagos ejecutados en el periodo`)}
    </div>
    <div class="sect grid g2">
      ${card('Antigüedad del backlog de revisión','Días desde la última aprobación interna del centro de costos','<div id="cx-aging"></div>')}
      ${card('Capacidad semanal del equipo','Solicitudes revisadas y pagadas por semana','<div id="cx-th"></div>')}
    </div>
    <div class="sect grid g2">
      ${card('Carga por persona','Revisiones + pagos ejecutados en el periodo','<div id="cx-load"></div>')}
      ${card('Posibles comprobantes duplicados',`${DATA.ndups} grupos en datos desde S28 — mostrando los 40 mayores`,dupTable)}
    </div>
    <div class="sect grid g2">
      ${card('Backlog más antiguo','Top 15 solicitudes esperando revisión',`<div style="max-height:320px;overflow:auto">${bkTable}</div>`)}
      ${card('Aprobadas sin pagar más antiguas','Top 15 — riesgo de reclamo del colaborador',`<div style="max-height:320px;overflow:auto">${oldTable}</div>`)}
    </div>`;
  document.querySelectorAll('#v-cxp tr[data-dup]').forEach(tr=>tr.addEventListener('click',()=>{const g=DATA.dups[+tr.dataset.dup];showDetail('Posible duplicado: '+g.key,g.ids.map(i=>idMap[+i]).filter(Boolean))}));
  mount('cx-aging',hbAging);
  const thEl=document.getElementById('cx-th');
  thEl.insertAdjacentHTML('beforebegin',legendHTML([{name:'Revisadas',color:css('--s1')},{name:'Pagadas',color:css('--s2')}]));
  mount('cx-th',lcTh);mount('cx-load',hbLoad);
}


// ---------- VIEW: Cumplimiento ----------
const RULES={
 R1:{l:'Gasto >$2,000 sin CFDI',ref:'§5.10: gastos mayores a $2,000 requieren comprobante fiscal',sev:'crit'},
 R3:{l:'>$2,000 pagado en efectivo',ref:'§5.10: exclusión absoluta — mayores a $2,000 deben pagarse por transferencia',sev:'crit'},
 R6:{l:'Categoría excluida: medicinas',ref:'§5.10: medicamentos de uso personal no proceden por ningún canal',sev:'crit'},
 R2:{l:'Fondo fijo fuera de rango',ref:'§5.5: el fondo fijo cubre compras de $1 a $2,000 MXN',sev:'ser'},
 R7:{l:'Hospedaje/viáticos fuera de Viajes',ref:'§5.2: hospedaje y viáticos sólo son elegibles en modalidad Viajes',sev:'ser'},
 R4:{l:'Comida >$650 por persona',ref:'§5.5: tope de $650/persona/día incluyendo propina',sev:'ser'},
 R6b:{l:'Rubro fuera del sistema: telefonía',ref:'§5.3: recargas y servicios de telefonía se gestionan por TI',sev:'warn'},
 R5:{l:'Propina >15%',ref:'§5.6: propinas no podrán exceder 15% del consumo',sev:'warn'},
 R8:{l:'Solicitado fuera del mes del gasto',ref:'§5.4: los reembolsos deben solicitarse en el mismo mes calendario',sev:'warn'}
};
const SEVC={crit:'var(--crit)',ser:'var(--serious)',warn:'var(--warn)'};
function renderCMP(rows){
  const fl=r=>r.v||[];
  const hard=rows.filter(r=>fl(r).some(f=>f!=='R8'));
  const hardAmt=hard.reduce((a,r)=>a+r.tot,0);
  const slaN=DATA.sla.reduce((a,s)=>a+s.n,0), slaO=DATA.sla.reduce((a,s)=>a+s.over,0);
  // by rule
  const order=['R1','R3','R6','R2','R7','R4','R6b','R5','R8'];
  const ruleItems=order.map(k=>{
    const rs=rows.filter(r=>fl(r).includes(k));
    if(!rs.length)return null;
    const amt=rs.reduce((a,r)=>a+r.tot,0);
    return {label:RULES[k].l,value:amt,valLabel:`${rs.length} · ${fmtC(amt)}`,color:SEVC[RULES[k].sev],rows:rs,dTitle:RULES[k].l,
      tip:`<b>${esc(RULES[k].l)}</b><div style="max-width:240px">${esc(RULES[k].ref)}</div><div class="r"><span class="muted">Solicitudes</span><span>${rs.length}</span></div><div class="r"><span class="muted">Monto</span><span>${fmt$(amt)}</span></div><div class="muted">Clic para ver registros</div>`};
  }).filter(Boolean);
  const hbRules=hbar(ruleItems,{labelW:230});
  // by cost center (hard rules only)
  const perCC={};
  hard.forEach(r=>{if(!r.cc)return;(perCC[r.cc]=perCC[r.cc]||{v:0,n:0}).v+=r.tot;perCC[r.cc].n++});
  const ccItems=Object.entries(perCC).sort((a,b)=>b[1].v-a[1].v).slice(0,10).map(([id,d])=>({
    label:CCS[id]?.name||('#'+id),value:d.v,valLabel:`${d.n} · ${fmtC(d.v)}`,rows:hard.filter(r=>r.cc===+id),dTitle:'Incumplimientos — '+(CCS[id]?.name||id),
    tip:`<b>${esc(CCS[id]?.name)}</b><div class="r"><span class="muted">Solicitudes</span><span>${d.n}</span></div><div class="r"><span class="muted">Monto</span><span>${fmt$(d.v)}</span></div>`}));
  const hbCC=hbar(ccItems,{labelW:210});
  // repeat offenders
  const perU={};
  hard.forEach(r=>{(perU[r.u]=perU[r.u]||{n:0,v:0,rules:new Set(),rows:[]}).n++;perU[r.u].v+=r.tot;fl(r).filter(f=>f!=='R8').forEach(f=>perU[r.u].rules.add(f));perU[r.u].rows.push(r)});
  const topU=Object.entries(perU).sort((a,b)=>b[1].v-a[1].v).slice(0,12);
  const uBody=topU.map(([u,d],i)=>`<tr data-uoff="${i}" style="cursor:pointer"><td>${esc(u)}</td><td class="n">${d.n}</td><td class="n">${fmt$(d.v)}</td><td>${[...d.rules].map(k=>RULES[k].l).join(' · ')}</td></tr>`).join('');
  const uTable=`<table><thead><tr><th>Solicitante</th><th class="n">Solic.</th><th class="n">Monto</th><th>Reglas incumplidas</th></tr></thead><tbody>${uBody}</tbody></table>`;
  // fraccionamiento
  const idMapAll={};DATA.rows.forEach(r=>idMapAll[r.id]=r);
  const frBody=DATA.frac.slice(0,15).map((g,i)=>`<tr data-frac="${i}" style="cursor:pointer"><td>${esc(g.rfc)}</td><td>${esc(g.u)}</td><td>${esc(g.fe)}</td><td class="n">${g.n}</td><td class="n">${fmt$(g.sum)}</td></tr>`).join('');
  const frTable=`<div style="max-height:320px;overflow:auto"><table><thead><tr><th>RFC emisor</th><th>Solicitante</th><th>Fecha</th><th class="n">Notas</th><th class="n">Suma</th></tr></thead><tbody>${frBody}</tbody></table></div>
  <div class="note">Fondo fijo: mismo emisor, misma persona, mismo día, cada nota ≤ $2,000 pero la suma rebasa el tope (§5.10 prohíbe compras fraccionadas para evadir topes). ${DATA.frac.length} grupos en total; mostrando 15 por monto. Datos desde S28.</div>`;
  // SLA table
  const slaBody=DATA.sla.slice(0,12).map(s=>`<tr><td>${esc(s.u)}</td><td class="n">${s.n.toLocaleString('es-MX')}</td><td class="n">${s.over}</td><td class="n"${s.over/s.n>0.4?' style="color:var(--crit)"':''}>${pct(s.over/s.n)}</td></tr>`).join('');
  const slaTable=`<table><thead><tr><th>Aprobador</th><th class="n">Aprob.</th><th class="n">&gt;48 h</th><th class="n">% fuera de SLA</th></tr></thead><tbody>${slaBody}</tbody></table>
  <div class="note">§5.11: los aprobadores deben decidir en máximo 48 horas. Datos desde S28 (mín. 20 aprobaciones), ordenado por % de incumplimiento.</div>`;

  document.getElementById('v-cmp').innerHTML=`
    <div class="grid g4 sect">
      ${kpi('Monto aprobado con incumplimiento',fmtC(hardAmt),`${hard.length} solicitudes (reglas §5.2–§5.10)`,true)}
      ${kpi('Fuera del mes calendario',rows.filter(r=>fl(r).includes('R8')).length.toLocaleString('es-MX'),fmtC(rows.filter(r=>fl(r).includes('R8')).reduce((a,r)=>a+r.tot,0))+' · §5.4')}
      ${kpi('Aprobaciones fuera de SLA 48 h',pct(slaO/slaN),`${slaO.toLocaleString('es-MX')} de ${slaN.toLocaleString('es-MX')} (desde S28)`)}
      ${kpi('Posible fraccionamiento',DATA.frac.length,`${DATA.frac.reduce((a,g)=>a+g.n,0)} notas · ${fmtC(DATA.frac.reduce((a,g)=>a+g.sum,0))}`)}
    </div>
    <div class="sect grid g2">
      ${card('Incumplimientos por regla','Solicitudes aprobadas o pagadas que violan la política — monto por regla, clic para ver registros','<div id="cmp-rules"></div><div class="note">Rojo: exclusiones absolutas (§5.10) · Naranja: topes y matriz de modalidades · Amarillo: reglas de disciplina. Una solicitud puede violar más de una regla.</div>')}
      ${card('Centros de costos con más incumplimientos','Monto aprobado en violación de reglas duras (excluye fuera-de-mes)','<div id="cmp-cc"></div>')}
    </div>
    <div class="sect grid g2">
      ${card('Posible fraccionamiento de compras','Grupos que en conjunto rebasan el tope de $2,000 del fondo fijo — clic para ver las notas',frTable)}
      ${card('Solicitantes con mayor monto en incumplimiento','Reglas duras, en el filtro actual — clic para ver sus registros',uTable)}
    </div>
    <div class="sect grid g2">
      ${card('Cumplimiento del SLA de aprobación (48 h)','Aprobadores internos con mayor % de decisiones tardías',slaTable)}
      ${card('Cómo leer esta pestaña','Criterios aplicados',`<div style="font-size:12.5px;line-height:1.6">${order.map(k=>`<div style="padding:3px 0"><span class="sw" style="background:${SEVC[RULES[k].sev]}"></span> <b>${RULES[k].l}.</b> <span class="muted">${esc(RULES[k].ref)}.</span></div>`).join('')}<div class="note">Se marcan sólo solicitudes que avanzaron (en revisión CxP, programadas o pagadas): el punto es que fueron aprobadas a pesar del incumplimiento. Borradores y rechazadas quedan fuera.</div></div>`)}
    </div>`;
  mount('cmp-rules',hbRules);mount('cmp-cc',hbCC);
  document.querySelectorAll('#v-cmp tr[data-frac]').forEach(tr=>tr.addEventListener('click',()=>{const g=DATA.frac[+tr.dataset.frac];showDetail(`Posible fraccionamiento — ${g.rfc} · ${g.fe} (${g.u})`,g.ids.map(i=>idMapAll[i]).filter(Boolean))}));
  document.querySelectorAll('#v-cmp tr[data-uoff]').forEach(tr=>tr.addEventListener('click',()=>{const [u,d]=topU[+tr.dataset.uoff];showDetail('Incumplimientos de '+u,d.rows)}));
}

function mount(id,chart){const el=document.getElementById(id);if(!el||!chart)return;el.innerHTML=chart.svg;chart.bind(el)}

// ---------- tabs & render ----------
let view='dg';
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  view=b.dataset.v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+view));
  render();
}));
function render(){
  const rows=filtered();
  document.getElementById('subtitle').textContent=
    `${rows.length.toLocaleString('es-MX')} solicitudes en el filtro · datos al 12 de agosto de 2026 · desde la semana 28 (se excluyen pruebas y capacitación previas) · montos en MXN · clic en cualquier barra, punto o renglón para ver el detalle`;
  if(view==='dg')renderDG(rows);
  if(view==='cc')renderCC(rows);
  if(view==='cxp')renderCXP(rows);
  if(view==='cmp')renderCMP(rows);
}
render();
</script>
